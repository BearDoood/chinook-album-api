spring.application.name=chinook-album-api

# Database connection, override with environment variables if yours differ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chinook}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# validate makes startup fail if the entity does not match the table
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
